plugins {
	id "java"
	id "net.minecraftforge.gradle" version "[6.0.25,6.2)"
	id "org.spongepowered.mixin" version "0.7.+"
}

group = "org.mtrbr"
version = "${mod_version}"
base {
	archivesName = "${mod_id}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

minecraft {
	mappings channel: "official", version: "${minecraft_version}"

	runs {
		client {
			workingDirectory project.file("run")
			property "forge.logging.console.level", "debug"
			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}
		server {
			workingDirectory project.file("run-server")
			property "forge.logging.console.level", "debug"
			args "--nogui"
			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}
	}
}

mixin {
	add sourceSets.main, "mtrbr.refmap.json"
	config "mtrbr.mixins.json"
}

repositories {
	flatDir {
		dirs "libs"
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	implementation files("libs/MTR-forge-${mtr_version}+${minecraft_version}.jar")
	annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

processResources {
	inputs.property "version", project.version
	from("LICENSE")
	from("LICENSES") {
		into("LICENSES")
	}
	from("THIRD_PARTY_NOTICES.md")
	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

// Exercise pure path projection and interlocking fixtures without launching Minecraft.
tasks.register("turnbackRegression", JavaExec) {
	group = "verification"
	description = "Checks fixed-Block boundaries at native/platform reverse occurrences"
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "org.mtrbr.server.TurnbackProjectionRegression"
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
	workingDir = layout.buildDirectory.dir("turnback-regression").get().asFile
	doFirst { workingDir.mkdirs() }
}
tasks.named("check") { dependsOn "turnbackRegression" }

// LINE editing must preserve native directed paths and persisted overlays.
tasks.register("depotPathRegression", JavaExec) {
    group = "verification"
    description = "Checks LINE path direction, validation and persisted route restoration"
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.mtrbr.web.DepotPathRegression"
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    workingDir = layout.buildDirectory.dir("depot-path-regression").get().asFile
    doFirst { workingDir.mkdirs() }
}
tasks.named("check") { dependsOn "depotPathRegression" }
